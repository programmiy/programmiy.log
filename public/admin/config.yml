backend:
  name: github
  repo: programmiy/programmiy.log
  branch: main
  auth_methods: [token]

media_folder: "public/images/uploads"
public_folder: "/programmiy.log/images/uploads"

collections:
  - name: "blog"
    label: "포스트"
    label_singular: "포스트"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "제목", name: "title", widget: "string", required: true }
      - { label: "설명(요약)", name: "description", widget: "text", required: false, default: "" }
      - { label: "작성일시", name: "date", widget: "datetime", required: true }
      - { label: "수정일시", name: "updatedDate", widget: "datetime", required: false }
      - { label: "썸네일 이미지", name: "thumbnail", widget: "image", required: false }
      - { label: "시리즈", name: "series", widget: "string", required: false, hint: "같은 시리즈 이름을 입력하면 자동으로 시리즈로 묶입니다." }
      - { label: "시리즈 순서", name: "seriesOrder", widget: "number", value_type: "int", required: false }
      - { label: "태그 목록", name: "tags", widget: "list", required: false, default: [] }
      - { label: "임시저장(Draft)", name: "draft", widget: "boolean", required: false, default: false }
      - { label: "본문 내용", name: "body", widget: "markdown", required: true }
